<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1920, height=1080">
    <title>Món quà của Molly</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Cormorant"; src: url(assets/fonts/CormorantGaramond-VF.ttf) format("truetype"); font-weight: 300 700; font-style: normal; }
      @font-face { font-family: "Cormorant"; src: url(assets/fonts/CormorantGaramond-Italic-VF.ttf) format("truetype"); font-weight: 300 700; font-style: italic; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1920px; height: 1080px; overflow: hidden; background: #141210; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #141210; font-family: "Cormorant", Georgia, serif; }
      .shot { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; transform-origin: 50% 50%; }
      .fog, .smoke, .flicker, .dark, .leak, .night, .dust, .rays { position: absolute; inset: 0; pointer-events: none; transform-origin: 50% 50%; }
      .fog { background-repeat: repeat-x; background-size: 3840px 1080px; }
      .fog-a { background-image: url(assets/fx/fog-a.png); }
      .fog-b { background-image: url(assets/fx/fog-b.png); }
      .smoke { background-image: url(assets/fx/smoke.png); background-repeat: no-repeat; background-size: 300px 800px; }
      .dust { background-image: url(assets/fx/dust.png); background-repeat: repeat; background-size: 1920px 1080px; }
      .dark { background: radial-gradient(ellipse 62% 58% at 50% 48%, rgba(8,7,6,0) 0%, rgba(8,7,6,0.35) 55%, rgba(8,7,6,0.97) 100%); }
      .card { position: absolute; left: 110px; bottom: 96px; padding: 18px 34px 20px; background: rgba(243,237,225,0.9); color: #1d1a16; box-shadow: 0 6px 30px rgba(0,0,0,0.25); border-left: 3px solid #3a332b; clip-path: inset(0% 100% 0% 0%); }
      .card.darkcard { background: rgba(22,19,16,0.9); color: #f1ebdf; border-left-color: #cfc5b4; }
      .card.act { font-style: italic; font-size: 44px; font-weight: 500; letter-spacing: 0.01em; }
      .card.file { display: flex; flex-direction: column; gap: 4px; }
      .card .kicker { font-size: 24px; font-weight: 600; letter-spacing: 0.28em; text-transform: uppercase; color: #4a4138; }
      .card .name { font-size: 62px; font-style: italic; font-weight: 500; line-height: 1.05; }
      .endtitle { position: absolute; left: 6%; width: 52%; top: 14%; display: flex; flex-direction: column; align-items: center; gap: 14px; color: #1b1814; text-align: center; text-shadow: 0 0 14px rgba(244,238,226,0.95), 0 0 30px rgba(244,238,226,0.85); }
      .endtitle .t1 { font-size: 112px; font-style: italic; font-weight: 500; line-height: 1; }
      .endtitle .t2 { font-size: 34px; font-weight: 600; letter-spacing: 0.14em; color: #3a332b; }
      #grain, #vignette, #fade { position: absolute; inset: 0; pointer-events: none; }
      #grain { background: url(assets/fx/grain.png) 0 0 / 960px 540px repeat; opacity: 0.7; z-index: 50; }
      #vignette { background: radial-gradient(ellipse at 50% 50%, rgba(0,0,0,0) 55%, rgba(12,10,8,0.5) 100%); z-index: 51; }
      #fade { background: #0c0a08; z-index: 60; }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-7c1p" id="root" data-composition-id="main" data-start="0" data-duration="{{TOTAL}}" data-width="1920" data-height="1080">
{{SHOTS}}
      <div data-hf-id="hf-f6d6" id="grain"></div>
      <div data-hf-id="hf-h7i3" id="vignette"></div>
      <div data-hf-id="hf-128z" id="fade"></div>
{{AUDIO}}
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      {{JS}}
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
